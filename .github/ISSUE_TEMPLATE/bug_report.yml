name: Bug report
description: Report a defect in an iCustomer repository.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please do not use this form for security issues — follow the [security policy](https://github.com/icustomerai/.github/blob/main/SECURITY.md) instead.
  - type: input
    id: linear
    attributes:
      label: Linear issue
      description: Associated Linear identifier, if one exists.
      placeholder: ENG-123
    validations:
      required: false
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal, ordered steps that reproduce the behaviour.
      placeholder: |
        1. Go to ...
        2. Do ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Service, version or commit, environment (development, staging, production), and any relevant configuration.
    validations:
      required: false
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Who is affected and how severely? Note any customer-data impact here.
    validations:
      required: false
