name: Feature request
description: Propose a change or new capability.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: input
    id: linear
    attributes:
      label: Linear issue
      description: Associated Linear identifier, if one exists.
      placeholder: ENG-123
    validations:
      required: false
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem or user need does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the change you would like. Include alternatives you considered.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Delivery and security impact
      description: Note any migration, deployment, or security and customer-data considerations.
    validations:
      required: false
